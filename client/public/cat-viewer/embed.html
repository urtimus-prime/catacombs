<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
<title>Cat Viewer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; touch-action: none; background: transparent; }
#canvas { display: block; width: 100%; height: 100%; }
#canvas:focus { outline: none; }
#status {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: transparent; display: flex; flex-direction: column;
  justify-content: center; align-items: center; z-index: 50;
}
#status-progress { width: 60%; max-width: 300px; }
#status-text { margin-top: 12px; font-size: 14px; color: #888; font-family: sans-serif; }
</style>
</head>
<body>
<canvas id="canvas">Your browser does not support the canvas tag.</canvas>
<div id="status">
  <progress id="status-progress"></progress>
  <div id="status-text">Loading...</div>
</div>

<script src="index.js"></script>
<script>
window._catCommands = [];

function _hexToRGB(hex) {
  return [parseInt(hex.slice(1,3),16)/255, parseInt(hex.slice(3,5),16)/255, parseInt(hex.slice(5,7),16)/255];
}

window.catViewer = {
  setAnimation: (name) => window._catCommands.push({cmd:'set_animation',value:name}),
  setPrimaryColor: (r,g,b) => window._catCommands.push({cmd:'set_primary_color',r,g,b}),
  setStripeColor: (r,g,b) => window._catCommands.push({cmd:'set_stripe_color',r,g,b}),
  setEyeColor: (r,g,b) => window._catCommands.push({cmd:'set_eye_color',r,g,b}),
  setPrimaryColorHex: (hex) => { const [r,g,b] = _hexToRGB(hex); window._catCommands.push({cmd:'set_primary_color',r,g,b}); },
  setStripeColorHex: (hex) => { const [r,g,b] = _hexToRGB(hex); window._catCommands.push({cmd:'set_stripe_color',r,g,b}); },
  setEyeColorHex: (hex) => { const [r,g,b] = _hexToRGB(hex); window._catCommands.push({cmd:'set_eye_color',r,g,b}); },
  setBoneScale: (bone, value) => window._catCommands.push({cmd:'set_bone_scale',bone,value}),
  setCamera: (dist, angleY, angleX) => window._catCommands.push({cmd:'set_camera',distance:dist,angle_y:angleY,angle_x:angleX}),
  setAutoRotate: (on) => window._catCommands.push({cmd:'set_auto_rotate',value:on}),
  setScene: (id) => window._catCommands.push({cmd:'set_scene',value:id}),
  setCameraTarget: (x, y, z) => window._catCommands.push({cmd:'set_camera_target',x,y,z}),
  setWeapon: (id) => window._catCommands.push({cmd:'set_weapon',value:id}),
  setHat: (id) => window._catCommands.push({cmd:'set_hat',value:id}),
  getAnimations: () => window._catAnimations || [],
  getScenes: () => window._catScenes || [],
  getHats: () => window._catHats || [],
  configure: (opts) => {
    if (opts.animation) catViewer.setAnimation(opts.animation);
    if (opts.scene) catViewer.setScene(opts.scene);
    if (opts.primaryColor) {
      const c = opts.primaryColor;
      typeof c === 'string' ? catViewer.setPrimaryColorHex(c) : catViewer.setPrimaryColor(c[0], c[1], c[2]);
    }
    if (opts.stripeColor) {
      const c = opts.stripeColor;
      typeof c === 'string' ? catViewer.setStripeColorHex(c) : catViewer.setStripeColor(c[0], c[1], c[2]);
    }
    if (opts.eyeColor) {
      const c = opts.eyeColor;
      typeof c === 'string' ? catViewer.setEyeColorHex(c) : catViewer.setEyeColor(c[0], c[1], c[2]);
    }
    if (opts.headSize != null) catViewer.setBoneScale('head_size', opts.headSize);
    if (opts.eyeSize != null) catViewer.setBoneScale('eye_size', opts.eyeSize);
    if (opts.bodyWidth != null) catViewer.setBoneScale('body_width', opts.bodyWidth);
    if (opts.tailSize != null) catViewer.setBoneScale('tail_size', opts.tailSize);
    if (opts.weapon) catViewer.setWeapon(opts.weapon);
    if (opts.hat) catViewer.setHat(opts.hat);
    if (opts.autoRotate != null) catViewer.setAutoRotate(opts.autoRotate);
    if (opts.camera) catViewer.setCamera(opts.camera.distance || 1.8, opts.camera.yaw || 0, opts.camera.pitch || -5);
    if (opts.cameraTarget) catViewer.setCameraTarget(opts.cameraTarget.x || 0, opts.cameraTarget.y || 0.55, opts.cameraTarget.z || 0);
  },
};

// Parse config from URL params or use defaults
const params = new URLSearchParams(window.location.search);
const initialConfig = {
  animation: params.get('animation') || 'Cat_Idle',
  scene: params.get('scene') || 'cosmic_void',
  auto_rotate: params.get('autoRotate') !== 'false',
  primary_color: [0.9, 0.55, 0.15],
  stripe_color: [0.4, 0.15, 0.05],
  eye_color: [0.3, 0.7, 0.2],
  camera: {
    distance: parseFloat(params.get('camDist') || '1.8'),
    angle_y: parseFloat(params.get('camY') || '15'),
    angle_x: parseFloat(params.get('camX') || '-10'),
  },
  camera_target: {
    x: parseFloat(params.get('camTargetX') || '0'),
    y: parseFloat(params.get('camTargetY') || '0.55'),
    z: parseFloat(params.get('camTargetZ') || '0'),
  },
};

const GODOT_CONFIG = {
  "args": ['--cat-config', JSON.stringify(initialConfig)],
  "canvasResizePolicy": 2,
  "executable": "index",
  "experimentalVK": false,
  "fileSizes": {"index.pck":34440452,"index.wasm":37685705},
  "focusCanvas": false,
  "gdextensionLibs": [],
};

const engine = new Engine(GODOT_CONFIG);
const statusEl = document.getElementById('status');
const statusProgress = document.getElementById('status-progress');
const statusText = document.getElementById('status-text');

engine.startGame({
  'onProgress': function (current, total) {
    if (current > 0 && total > 0) {
      statusProgress.value = current;
      statusProgress.max = total;
      const pct = Math.round(current / total * 100);
      statusText.textContent = pct + '%';
    }
  },
}).then(() => {
  statusEl.remove();
  // Listen for configure messages from parent
  window.addEventListener('message', (e) => {
    if (e.data && e.data.type === 'catViewer:configure') {
      window.catViewer.configure(e.data.config);
    }
  });
  // Notify parent that Godot is ready to receive commands
  if (window.parent !== window) {
    window.parent.postMessage({ type: 'catViewer:ready' }, '*');
  }

  // === Camera controls: orbit, pan, zoom ===
  const canvas = document.getElementById('canvas');
  const ORBIT_SENSITIVITY = 0.4;
  const ZOOM_SENSITIVITY = 0.002;
  const PINCH_SENSITIVITY = 0.01;
  const PAN_SENSITIVITY = 0.003;
  const MIN_PITCH = -80, MAX_PITCH = 80;

  let camDist = initialConfig.camera.distance;
  let camYaw = initialConfig.camera.angle_y;
  let camPitch = initialConfig.camera.angle_x;
  let camTargetX = initialConfig.camera_target.x;
  let camTargetY = initialConfig.camera_target.y;
  let camTargetZ = initialConfig.camera_target.z;
  let isDragging = false, isPanning = false;
  let lastX = 0, lastY = 0;

  function updateCamera() {
    window.catViewer.setCamera(camDist, camYaw, camPitch);
  }
  function updateTarget() {
    window.catViewer.setCameraTarget(camTargetX, camTargetY, camTargetZ);
  }

  // Apply initial camera target from URL params (before any postMessage)
  updateTarget();

  // Mouse: left-drag orbit, middle-drag pan, wheel zoom
  canvas.addEventListener('mousedown', (e) => {
    if (e.button === 0) { isDragging = true; }
    else if (e.button === 1) { isPanning = true; e.preventDefault(); }
    lastX = e.clientX; lastY = e.clientY;
  });
  window.addEventListener('mouseup', () => { isDragging = false; isPanning = false; });
  window.addEventListener('mousemove', (e) => {
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    if (isDragging) {
      window.catViewer.setAutoRotate(false);
      camYaw += dx * ORBIT_SENSITIVITY;
      camPitch = Math.max(MIN_PITCH, Math.min(MAX_PITCH, camPitch - dy * ORBIT_SENSITIVITY));
      updateCamera();
    } else if (isPanning) {
      const yawRad = camYaw * Math.PI / 180;
      camTargetX += (-Math.cos(yawRad) * dx + Math.sin(yawRad) * 0) * PAN_SENSITIVITY;
      camTargetY += dy * PAN_SENSITIVITY;
      camTargetZ += (Math.sin(yawRad) * dx) * PAN_SENSITIVITY;
      updateTarget();
    }
  });
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    camDist = Math.max(0.5, Math.min(5.0, camDist + e.deltaY * ZOOM_SENSITIVITY));
    updateCamera();
  }, { passive: false });

  // Touch: 1-finger orbit, 2-finger pan + pinch zoom
  let touches = [];
  let lastPinchDist = 0;
  canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    touches = [...e.touches];
    if (touches.length === 2) {
      lastPinchDist = Math.hypot(touches[1].clientX - touches[0].clientX, touches[1].clientY - touches[0].clientY);
    }
  }, { passive: false });
  canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    const newTouches = [...e.touches];
    if (newTouches.length === 1 && touches.length === 1) {
      const dx = newTouches[0].clientX - touches[0].clientX;
      const dy = newTouches[0].clientY - touches[0].clientY;
      window.catViewer.setAutoRotate(false);
      camYaw += dx * ORBIT_SENSITIVITY;
      camPitch = Math.max(MIN_PITCH, Math.min(MAX_PITCH, camPitch - dy * ORBIT_SENSITIVITY));
      updateCamera();
    } else if (newTouches.length === 2 && touches.length === 2) {
      // Pan
      const cx = (newTouches[0].clientX + newTouches[1].clientX) / 2;
      const cy = (newTouches[0].clientY + newTouches[1].clientY) / 2;
      const pcx = (touches[0].clientX + touches[1].clientX) / 2;
      const pcy = (touches[0].clientY + touches[1].clientY) / 2;
      const yawRad = camYaw * Math.PI / 180;
      camTargetX += (-Math.cos(yawRad) * (cx - pcx)) * PAN_SENSITIVITY;
      camTargetY += (cy - pcy) * PAN_SENSITIVITY;
      camTargetZ += (Math.sin(yawRad) * (cx - pcx)) * PAN_SENSITIVITY;
      updateTarget();
      // Pinch zoom
      const pinchDist = Math.hypot(newTouches[1].clientX - newTouches[0].clientX, newTouches[1].clientY - newTouches[0].clientY);
      camDist = Math.max(0.5, Math.min(5.0, camDist - (pinchDist - lastPinchDist) * PINCH_SENSITIVITY));
      lastPinchDist = pinchDist;
      updateCamera();
    }
    touches = newTouches;
  }, { passive: false });
}, (err) => {
  console.error(err);
  statusText.textContent = 'Error: ' + err.message;
  statusText.style.color = '#e55';
});
</script>
</body>
</html>
