name: Deploy Client

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}/client:latest

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: true
          tags: ${{ env.IMAGE }}
          build-args: |
            VITE_RPC_URL=${{ vars.VITE_RPC_URL }}
            VITE_TORII_URL=${{ vars.VITE_TORII_URL }}
            VITE_CHAIN=${{ vars.VITE_CHAIN }}

      - name: Set Railway image source
        run: |
          curl -sf -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
            -H "Content-Type: application/json" \
            https://backboard.railway.com/graphql/v2 \
            -d '{
              "query": "mutation { serviceInstanceUpdate(serviceId: \"${{ vars.RAILWAY_SERVICE_ID }}\", environmentId: \"${{ vars.RAILWAY_ENV_ID }}\", input: { source: { image: \"${{ env.IMAGE }}\" } }) }"
            }'

      - name: Deploy on Railway
        run: |
          curl -sf -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
            -H "Content-Type: application/json" \
            https://backboard.railway.com/graphql/v2 \
            -d '{
              "query": "mutation { serviceInstanceDeployV2(serviceId: \"${{ vars.RAILWAY_SERVICE_ID }}\", environmentId: \"${{ vars.RAILWAY_ENV_ID }}\") }"
            }'
